name: Design Improvement
description: Propose an evidence-backed improvement within the approved design identity.
title: "[Design] "
labels:
  - "type/design"
  - "status/needs-review"
  - "evidence/required"
body:
  - type: input
    id: mockup_version
    attributes:
      label: Mockup Version
      placeholder: V34 / v1.0.0-rc.1
    validations:
      required: true
  - type: input
    id: page_route
    attributes:
      label: Page / Route
      placeholder: pilot/public/f33home
    validations:
      required: true
  - type: input
    id: component_name
    attributes:
      label: Component Name
      placeholder: Core.Card
  - type: input
    id: component_reference
    attributes:
      label: Component Reference ID
      placeholder: pilot/public/f33home#Core.Card@abc123
  - type: input
    id: visual_design_key
    attributes:
      label: Visual Design Key
      placeholder: forma.surface.semantic
  - type: input
    id: viewport
    attributes:
      label: Viewport
      placeholder: 1440 x 900
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Attach current-state evidence and any accepted comparison.
      placeholder: Drag reviewed screenshots here or provide evidence links.
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current Behavior
      description: Describe the current visual or design-system behavior.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Explain the user benefit and which established Forma rule supports it.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Note design-freeze, compatibility or scope implications.
